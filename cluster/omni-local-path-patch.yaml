metadata:
  namespace: default
  type: ConfigPatches.omni.sidero.dev
  id: 400-rns1-prod-workers-local-path
  labels:
    omni.sidero.dev/cluster: rns1-prod
    omni.sidero.dev/machine-set: rns1-prod-workers
  annotations:
    name: local-path-provisioner kubelet mount
    description: Exposes /var/local-path-provisioner to the kubelet for local-path volumes
spec:
  data: |
    machine:
      kubelet:
        extraMounts:
          - destination: /var/local-path-provisioner
            type: bind
            source: /var/local-path-provisioner
            options:
              - bind
              - rshared
              - rw
