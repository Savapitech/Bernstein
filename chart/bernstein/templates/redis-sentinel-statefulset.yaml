apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis-sentinel

spec:
  serviceName: redis-sentinel

  replicas: {{.Values.redis.sentinel.replicas}}

  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: redis-sentinel

  template:
    metadata:
      labels:
        app: redis-sentinel

    spec:
      securityContext:
        {{- toYaml .Values.redis.podSecurityContext | nindent 8 }}

      {{- include "bernstein.spread" "redis-sentinel" | nindent 6 }}

      containers:
        - name: sentinel

          image: "{{.Values.redis.image.repository}}:{{.Values.redis.image.tag}}"

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          command:
            - sh
            - -c
            - |
              domain="svc.{{ .Values.clusterDomain }}"
              master=""
              while [ -z "$master" ]; do
                master="$(redis-cli -h redis-sentinel -p 26379 --raw SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1)"
                if [ -z "$master" ]; then
                  for i in $(seq 0 $(({{.Values.redis.replicas}} - 1))); do
                    host="redis-$i.redis-headless.$NAMESPACE.$domain"
                    if redis-cli -h "$host" info replication 2>/dev/null | grep -q '^role:master'; then
                      master="$(getent hosts "$host" | awk '{ print $1 }')"
                      break
                    fi
                  done
                fi
                [ -n "$master" ] || sleep 2
              done
              cat > /data/sentinel.conf <<EOF
              port 26379
              sentinel resolve-hostnames yes
              sentinel announce-hostnames yes
              sentinel announce-ip $HOSTNAME.redis-sentinel.$NAMESPACE.$domain
              sentinel monitor mymaster $master 6379 {{.Values.redis.sentinel.quorum}}
              sentinel down-after-milliseconds mymaster {{.Values.redis.sentinel.downAfterMilliseconds}}
              sentinel failover-timeout mymaster {{.Values.redis.sentinel.failoverTimeout}}
              sentinel parallel-syncs mymaster 1
              EOF
              exec redis-sentinel /data/sentinel.conf

          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          ports:
            - containerPort: 26379

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            {{- toYaml .Values.redis.sentinel.resources | nindent 12 }}

          startupProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - ping
            periodSeconds: 5
            failureThreshold: 60

          livenessProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            exec:
              command:
                - redis-cli
                - -p
                - "26379"
                - ping
            periodSeconds: 5

      volumes:
        - name: data
          emptyDir: {}
