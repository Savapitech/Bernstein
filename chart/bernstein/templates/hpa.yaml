{{- range $app := list "poll" "result" "worker" }}
{{- with (index $.Values $app).autoscaling.horizontal }}
{{- if .enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: {{ $app }}

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $app }}

  minReplicas: {{ .minReplicas }}
  maxReplicas: {{ .maxReplicas }}

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .targetCPUUtilization }}
{{- end }}
{{- end }}
{{- end }}
