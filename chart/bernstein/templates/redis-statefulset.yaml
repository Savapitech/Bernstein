apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis

spec:
  serviceName: redis-headless

  replicas: {{.Values.redis.replicas}}

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      securityContext:
        {{- toYaml .Values.redis.podSecurityContext | nindent 8 }}

      {{- with .Values.redis.affinity }}

      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: redis

          image: "{{.Values.redis.image.repository}}:{{.Values.redis.image.tag}}"

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          command:
            - sh
            - -c
            - |
              me="$(hostname -i)"
              master=""
              while [ -z "$master" ]; do
                master="$(redis-cli -h redis-sentinel -p 26379 --raw SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1)"
                if [ -z "$master" ]; then
                  if [ "${HOSTNAME##*-}" = "0" ]; then
                    master="$me"
                  else
                    master="$(getent hosts "redis-0.redis-headless.$NAMESPACE.svc.{{ .Values.clusterDomain }}" | awk '{ print $1 }')"
                    [ -n "$master" ] || sleep 2
                  fi
                elif [ "$master" != "$me" ] && [ "$(redis-cli -h "$master" ping 2>/dev/null)" != "PONG" ]; then
                  master=""
                  sleep 2
                fi
              done
              if [ "$master" = "$me" ]; then
                exec redis-server --appendonly yes
              fi
              exec redis-server --appendonly yes --replicaof "$master" 6379

          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

          resources:
            {{- toYaml .Values.redis.resources | nindent 12}}

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5

  volumeClaimTemplates:
    - metadata:
        name: redis-data

      spec:
        accessModes:
          - ReadWriteOnce

        {{- with .Values.redis.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}

        resources:
          requests:
            storage: {{.Values.redis.storage.size}}
