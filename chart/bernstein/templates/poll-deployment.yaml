apiVersion: apps/v1
kind: Deployment

metadata:
  name: poll

spec:
  replicas: {{.Values.poll.replicas}}

  selector:
    matchLabels:
      app: poll

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: poll

    spec:
      securityContext:
        {{- toYaml .Values.poll.podSecurityContext | nindent 8 }}

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}

      containers:
        - name: poll

          image: "{{.Values.poll.image.repository}}:{{.Values.poll.image.tag}}"
          imagePullPolicy: {{ .Values.poll.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - containerPort: 80

          env:
            - name: REDIS_HOST
              value: "redis"

          resources:
            {{- toYaml .Values.poll.resources | nindent 12}}

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

