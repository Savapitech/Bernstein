apiVersion: apps/v1
kind: Deployment

metadata:
  name: result

spec:
  {{- if not .Values.result.autoscaling.horizontal.enabled }}
  replicas: {{.Values.result.replicas}}
  {{- end }}

  selector:
    matchLabels:
      app: result

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: result

    spec:
      securityContext:
        {{- toYaml .Values.result.podSecurityContext | nindent 8 }}

      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}

      containers:
        - name: result
          
          image: "{{.Values.result.image.repository}}:{{.Values.result.image.tag}}"
          imagePullPolicy: {{.Values.result.image.pullPolicy}}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}

          ports:
            - containerPort: 80

          lifecycle:
            preStop:
              sleep:
                seconds: 5

          env:
            - name: REDIS_HOST
              value: "redis"

            - name: POSTGRES_HOST
              value: {{ .Values.db.host | quote }}

            - name: POSTGRES_PORT
              value: {{ .Values.db.port | quote }}

            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecret.name }}
                  key: {{ .Values.db.passwordSecret.key }}

          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            timeoutSeconds: 5
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 80
            timeoutSeconds: 5
            initialDelaySeconds: 3
            periodSeconds: 5
