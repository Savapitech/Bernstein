{{- range $app := list "poll" "result" "worker" }}
{{- $autoscaling := (index $.Values $app).autoscaling }}
{{- with $autoscaling.vertical }}
{{- if .enabled }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: {{ $app }}

spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $app }}

  updatePolicy:
    updateMode: Recreate
    minReplicas: {{ $autoscaling.horizontal.minReplicas }}

  resourcePolicy:
    containerPolicies:
      - containerName: {{ $app }}
        controlledResources:
          - memory
        minAllowed:
          memory: {{ .minMemory }}
        maxAllowed:
          memory: {{ .maxMemory }}
{{- end }}
{{- end }}
{{- end }}
