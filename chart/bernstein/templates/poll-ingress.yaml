{{- if .Values.poll.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: poll

spec:
  ingressClassName: {{.Values.ingress.className}}

  rules:
    - host: {{.Values.poll.ingress.host | quote}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poll
                port:
                  number: {{.Values.poll.service.port}}
{{- end }}
