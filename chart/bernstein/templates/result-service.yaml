apiVersion: v1
kind: Service

metadata:
  name: result

  {{- with .Values.result.ingress.stickyCookie }}
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: {{ . | quote }}
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
  {{- end }}

spec:
  type: {{.Values.result.service.type}}

  selector:
    app: result

  ports:
    - port: {{.Values.result.service.port}}
      targetPort: {{.Values.result.service.targetPort}}
      {{- if .Values.result.service.nodePort }}
      nodePort: {{.Values.result.service.nodePort}}
      {{- end }}
      protocol: TCP
