{{- if .Values.result.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: result

spec:
  ingressClassName: {{.Values.ingress.className}}

  rules:
    - host: {{.Values.result.ingress.host | quote}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: result
                port:
                  number: {{.Values.result.service.port}}
{{- end }}
