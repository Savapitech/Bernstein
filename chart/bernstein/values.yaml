imagePullSecret: gitlab-registry

clusterDomain: cluster.local

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

ingress:
  className: traefik

db:
  host: db-rw
  port: 5432
  name: votes
  user: app
  passwordSecret:
    name: postgres-secret
    key: password

redis:
  image:
    repository: redis
    tag: "7.4"

  replicas: 2

  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: redis

  storage:
    size: 1Gi
    # empty to use the cluster default
    storageClassName: ""

  sentinel:
    replicas: 3
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 10000
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  haproxy:
    image:
      repository: haproxy
      tag: "3.2"
    replicas: 2
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"

  service:
    type: ClusterIP
    port: 6379

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

postgres:
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "16"

  replicas: 2

  storage:
    size: 1Gi
    # empty to use the cluster default
    storageClassName: ""

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

poll:
  replicas: 2

  autoscaling:
    horizontal:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilization: 70

    vertical:
      enabled: true
      minMemory: 128Mi
      maxMemory: 1Gi

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/poll
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  ingress:
    enabled: true
    host: poll.bernstein.local

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

worker:
  replicas: 1

  autoscaling:
    horizontal:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilization: 70

    vertical:
      enabled: true
      minMemory: 128Mi
      maxMemory: 1Gi

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/worker
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

result:
  replicas: 2

  autoscaling:
    horizontal:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilization: 70

    vertical:
      enabled: true
      minMemory: 128Mi
      maxMemory: 1Gi

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/result
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  ingress:
    enabled: true
    host: result.bernstein.local
    stickyCookie: result_sticky

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

