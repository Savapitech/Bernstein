imagePullSecret: gitlab-registry

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

db:
  host: postgres
  port: 5432
  name: votes
  user: postgres
  passwordSecret:
    name: postgres-secret
    key: POSTGRES_PASSWORD

redis:
  image:
    repository: redis
    tag: "7.4"

  replicas: 1

  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999

  service:
    type: ClusterIP
    port: 6379

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

postgres:
  image:
    repository: postgres
    tag: "16"

  podSecurityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch

  storage:
    size: 1Gi

  service:
    type: ClusterIP
    port: 5432

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

poll:
  replicas: 2

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/poll
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

worker:
  replicas: 1

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/worker
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

result:
  replicas: 1

  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    sysctls:
      - name: net.ipv4.ip_unprivileged_port_start
        value: "0"

  image:
    repository: registry.vyme.fr/savalet/bernstein/result
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

