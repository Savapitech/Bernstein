apiVersion: v1
kind: Service

metadata:
  name: poll

spec:
  type: {{.Values.poll.service.type}}

  selector:
    app: poll

  ports:
    - port: {{.Values.poll.service.port}}
      targetPort: {{.Values.poll.service.targetPort}}
      {{- if .Values.poll.service.nodePort }}
      nodePort: {{.Values.poll.service.nodePort}}
      {{- end }}
      protocol: TCP
