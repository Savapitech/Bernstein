apiVersion: apps/v1
kind: Deployment

metadata:
  name: result

spec:
  replicas: {{.Values.result.replicas}}

  selector:
    matchLabels:
      app: result
  
  template:
    metadata:
      labels:
        app: result

    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}

      containers:
        - name: result
          
          image: "{{.Values.result.image.repository}}:{{.Values.result.image.tag}}"
          imagePullPolicy: {{.Values.result.image.pullPolicy}}

          ports:
            - containerPort: 80

          env:
            - name: REDIS_HOST
              value: "redis"

            - name: POSTGRES_HOST
              value: {{ .Values.db.host | quote }}

            - name: POSTGRES_PORT
              value: {{ .Values.db.port | quote }}

            - name: POSTGRES_DB
              value: {{ .Values.db.name | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.db.user | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.passwordSecret.name }}
                  key: {{ .Values.db.passwordSecret.key }}

          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}



