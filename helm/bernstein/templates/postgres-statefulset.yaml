apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
      - name: postgres

        image: "{{.Values.postgres.image.repository}}:{{.Values.postgres.image.tag}}"

        ports:
          - containerPort: 5432

        env:
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-secret
                key: POSTGRES_PASSWORD

          - name: POSTGRES_DB
            value: "votes"

        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
    
        resources:
          {{- toYaml .Values.postgres.resources | nindent 12}}

        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - postgres
              - -d
              - votes
          initialDelaySeconds: 5
          periodSeconds: 5
            
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
    
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{.Values.postgres.storage.size}}

