apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres

spec:
  serviceName: postgres

  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}

      containers:
      - name: postgres

        image: "{{.Values.postgres.image.repository}}:{{.Values.postgres.image.tag}}"

        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}

        ports:
          - containerPort: 5432

        env:
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Values.db.passwordSecret.name }}
                key: {{ .Values.db.passwordSecret.key }}

          - name: POSTGRES_USER
            value: {{ .Values.db.user | quote }}

          - name: POSTGRES_DB
            value: {{ .Values.db.name | quote }}

        volumeMounts:
          - name: postgres-data
            mountPath: /var/lib/postgresql/data
    
        resources:
          {{- toYaml .Values.postgres.resources | nindent 12}}

        readinessProbe:
          exec:
            command:
              - pg_isready
              - -U
              - {{ .Values.db.user | quote }}
              - -d
              - {{ .Values.db.name | quote }}
          initialDelaySeconds: 5
          periodSeconds: 5
            
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
    
      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{.Values.postgres.storage.size}}

