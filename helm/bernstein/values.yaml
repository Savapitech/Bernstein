imagePullSecret: gitlab-registry

db:
  host: postgres
  port: 5432
  name: votes
  user: postgres
  passwordSecret:
    name: postgres-secret
    key: POSTGRES_PASSWORD

redis:
  image:
    repository: redis
    tag: "7.4"

  replicas: 1
  
  service:
    type: ClusterIP
    port: 6379

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

postgres:
  image:
    repository: postgres
    tag: "16"
  
  storage:
    size: 1Gi

  service:
    type: ClusterIP
    port: 5432

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

poll:
  replicas: 2

  image:
    repository: registry.vyme.fr/savalet/bernstein/poll
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

worker:
  replicas: 1

  image:
    repository: registry.vyme.fr/savalet/bernstein/worker
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

result:
  replicas: 2

  image:
    repository: registry.vyme.fr/savalet/bernstein/result
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: ""

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

