redis:
  image:
    repository: redis
    tag: "7.4"

  replicas: 1
  
  service:
    port: 6379

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

postgres:
  image:
    repository: postgres
    tag: "16"
  
  storage:
    size: 1Gi

  service:
    port: 5432

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

