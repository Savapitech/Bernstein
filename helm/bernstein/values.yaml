redis:
  image:
    repository: redis
    tag: "7.4"

  replicas: 1
  
  service:
    port: 6379

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

postgres:
  image:
    repository: postgres
    tag: "16"
  
  storage:
    size: 1Gi

  service:
    port: 5432

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

poll:
  replicas: 2

  image:
    repository: registry.vyme.fr/savalet/bernstein/poll
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 80
    targetPort: 80 

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

worker:
  replicas: 1

  image:
    repository: registry.vyme.fr/savalet/bernstein/worker
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

result:
  replicas: 2

  image:
    repository: registry.vyme.fr/savalet/bernstein/result
    tag: "latest"
    pullPolicy: IfNotPresent

  service:
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1024Mi"

